<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>owctl — OpenWrt control</title>
<style>
:root{--bg:#0f1420;--panel:#161d2e;--panel2:#1c2540;--tx:#dbe4f5;--mut:#8b98b8;--acc:#4da3ff;--ok:#39c07f;--warn:#f5b544;--bad:#f4636e;--crit:#ff5470;--line:#26314f}
.light{--bg:#f0f2f5;--panel:#fff;--panel2:#e8eaf0;--tx:#1a1a2e;--mut:#6b7280;--line:#d1d5db}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;align-items:center;gap:14px;padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0;font-weight:600}
header h1 span{color:var(--acc)}
nav{display:flex;gap:4px;margin-left:20px}
nav button{background:none;border:0;color:var(--mut);padding:8px 12px;cursor:pointer;border-radius:8px;font-size:14px}
nav button.on{background:var(--panel2);color:var(--tx)}
main{padding:18px 20px;max-width:1200px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.card h3{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.kv{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed #222c47;font-size:13px}
.kv span:first-child{color:var(--mut)}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600}
.b-online{background:#123527;color:var(--ok)} .b-offline{background:#3a1520;color:var(--bad)}
.b-unknown{background:#2a2f42;color:var(--mut)}
.b-INFO{background:#2a2f42;color:var(--mut)} .b-LOW{background:#123527;color:var(--ok)}
.b-MEDIUM{background:#3a2f12;color:var(--warn)} .b-HIGH{background:#3a1520;color:var(--bad)}
.b-CRITICAL{background:#4a1020;color:var(--crit)}
button.act{background:var(--panel2);color:var(--tx);border:1px solid var(--line);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px}
button.act:hover{border-color:var(--acc)}
button.pri{background:#1c4d8f;border-color:#2f6fc0}
input,select{background:#0d1322;border:1px solid var(--line);color:var(--tx);padding:7px 10px;border-radius:8px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label{color:var(--mut);font-size:12px;display:block;margin-bottom:3px}
.fsec{margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid #222c47}
th{color:var(--mut);font-weight:500}
.small{color:var(--mut);font-size:12px}
.finding{border-left:3px solid var(--acc);padding:8px 12px;background:var(--panel2);border-radius:8px;margin:8px 0}
.finding.MEDIUM{border-color:var(--warn)} .finding.HIGH{border-color:var(--bad)} .finding.CRITICAL{border-color:var(--crit)} .finding.INFO,.finding.LOW{border-color:var(--mut)}
pre{background:#0b111e;border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;font-size:12px;max-height:300px}
.muted{color:var(--mut)}
.pill{font-size:11px;color:var(--mut)}
#toast{position:fixed;right:16px;bottom:16px;background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:10px;display:none;z-index:9}
</style>
</head>
<body>
<header>
  <h1>ow<span>ctl</span> <span class="pill">OpenWrt control + threat watch</span></h1>
  <nav>
    <button data-tab="devices" class="on">Devices</button>
    <button data-tab="threats">Threats</button>
    <button data-tab="sweep">Sweep</button>
    <button data-tab="alerts">Alerting</button>
    <button data-tab="map">Network Map</button>
    <button data-tab="vlans">VLANs</button>
    <button data-tab="logs">Device Logs</button>
  </nav>
  <button class="act" id="theme-btn" onclick="toggleTheme()" title="Toggle theme" style="margin-left:auto">🌓</button>
</header>
<main>
  <section id="tab-devices"></section>
  <section id="tab-threats" style="display:none"></section>
  <section id="tab-sweep" style="display:none"></section>
  <section id="tab-alerts" style="display:none"></section>
  <section id="tab-map" style="display:none"></section>
  <section id="tab-vlans" style="display:none"></section>
  <section id="tab-logs" style="display:none"></section>
</main>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let TOKEN=localStorage.getItem('owctl_token')||'';
async function api(path,opts={}){
  opts.headers=Object.assign({'Content-Type':'application/json'},opts.headers||{});
  if(TOKEN)opts.headers['Authorization']='Bearer '+TOKEN;
  const r=await fetch('/api'+path,opts);
  if(r.status===401){const t=prompt('owctl token:');if(t){TOKEN=t;localStorage.setItem('owctl_token',t);return api(path,opts)}throw new Error('unauthorized')}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.detail||j.error||r.status);
  return j;
}
function toast(m,bad){const t=$('#toast');t.textContent=m;t.style.display='block';t.style.borderColor=bad?'var(--bad)':'var(--line)';setTimeout(()=>t.style.display='none',4000)}
const navBtns=[...document.querySelectorAll('nav button')];
navBtns.forEach(b=>b.onclick=()=>{
  navBtns.forEach(x=>x.classList.toggle('on',x===b));
  navBtns.forEach(btn=>{
    const tabId='tab-'+btn.dataset.tab;
    const tab=document.getElementById(tabId);
    if(tab)tab.style.display=(btn===b)?'':'none';
  });
  render(b.dataset.tab);
});
function render(tab){
  if(tab==='devices')return renderDevices();
  if(tab==='threats')return renderThreats();
  if(tab==='sweep')return renderSweep();
  if(tab==='alerts')return renderAlerts();
  if(tab==='map')return renderMap();
  if(tab==='logs')return renderLogs();
  if(tab==='vlans')return renderVlans();
}
function fmtUptime(s){if(!s&&s!==0)return '—';const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return (d?d+'d ':'')+h+'h '+m+'m'}
function fmtKB(k){return k>1048576?(k/1048576).toFixed(1)+' GB':(k/1024).toFixed(0)+' MB'}

async function renderDevices(){
  const devs=await api('/devices');
  const host=document.getElementById('tab-devices');
  let html=`<div class="row" style="justify-content:space-between;margin-bottom:12px">
    <strong>Devices (${devs.length})</strong>
    <div class="row">
      <input type="text" id="dev-search" placeholder="Search…" style="width:160px" oninput="filterDevices(this.value)">
      <input type="checkbox" id="bulk-all" onchange="toggleAll(this.checked)">
      <label for="bulk-all" class="small muted">Select all</label>
      <button class="act bulk-action-btn" onclick="bulkAction('check')" disabled>Check Selected</button>
      <button class="act bulk-action-btn" onclick="bulkAction('backup')" disabled>Backup Selected</button>
      <button class="act" onclick="renderDevices()">Refresh</button>
      <div class="dropdown" style="position:relative;display:inline-block">
        <button class="act pri">+ Add device ▾</button>
        <div class="dropdown-menu" style="display:none;position:absolute;right:0;top:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px;min-width:180px;z-index:50;margin-top:4px">
          <button class="act" onclick="promptAdd();this.closest('.dropdown').style.display='none'" style="width:100%;text-align:left">Add manually</button>
          <button class="act" onclick="goSweep();this.closest('.dropdown').style.display='none'" style="width:100%;text-align:left">Scan network (Sweep)</button>
        </div>
      </div>
    </div></div>`;
  if(!devs.length)html+=`<p class="muted">No devices yet. Add one manually, or run a <button class="act" onclick="goSweep()">LAN sweep</button>.</p>`;
  html+=`<div id="dev-grid" class="grid">`;
  for(const d of devs){
    const badge=`<span class="badge b-${d.status}">${d.status}</span>`;
    const hs=d.health_score!=null?`<span class="badge ${d.health_score>=80?'b-online':d.health_score>=50?'b-MEDIUM':'b-CRITICAL'}" style="margin-left:6px">${d.health_score}</span>`:'';
    const tags=d.tags?`<span style="color:var(--mut);font-size:11px;margin-left:8px">#${esc(d.tags)}</span>`:'';
    html+=`<div class="card dev-card" data-id="${d.id}" data-name="${esc(d.name)}" data-host="${esc(d.host)}">
      <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:4px">
        <input type="checkbox" class="bulk-cb" data-id="${d.id}" onchange="updateBulkBtn()">
        <span class="small muted">${esc(d.host)}</span>
      </div>
      <h3>${esc(d.name)} <span>${badge}${hs}${tags}</span></h3>
      <div class="kv"><span>Last checked</span><span class="small">${esc(d.last_checked||'never')}</span></div>
      <div id="devinfo-${d.id}"></div>
      <div class="row fsec">
        <button class="act" onclick="testDev(${d.id})">Test</button>
        ${d.access==='ssh'?'<button class="act" onclick="pushKey('+d.id+')">Push SSH key</button>':''}
        <button class="act" onclick="chk(${d.id})">Check now</button>
        <button class="act" onclick="backup(${d.id})">Backup</button>
        <button class="act" onclick="openUpgrades(${d.id})">Updates</button>
        <button class="act" onclick="reboot(${d.id})">Reboot</button>
        <button class="act" onclick="restore(${d.id})">Restore</button>
        <button class="act" onclick="showConfigHistory(${d.id})">Config History</button>
        <button class="act" onclick="editDev(${d.id})">Edit</button>
        <button class="act" onclick="delDev(${d.id})">Delete</button>
      </div>
    </div>`;
  }
  html+=`</div>`;
  host.innerHTML=html;
}
function filterDevices(q){
  q=q.toLowerCase();
  document.querySelectorAll('.dev-card').forEach(c=>{
    const txt=(c.dataset.name+' '+c.dataset.host).toLowerCase();
    c.style.display=txt.includes(q)?'':'none';
  });
}
let _pollTm=null;
function startPolling(ms=60000){
  stopPolling();
  renderDevices();
  _pollTm=setInterval(renderDevices,ms);
}
function stopPolling(){if(_pollTm){clearInterval(_pollTm);_pollTm=null;}}
function goSweep(){document.querySelector('nav button[data-tab=sweep]').click()}
async function chk(id){
  toast('Checking…');
  try{
    const r=await api(`/devices/${id}/check`,{method:'POST'});
    showDevInfo(id,r.status);
    toast(`Checked. ${r.findings.length} finding(s).`);
  }catch(e){toast(String(e),true)}
}
async function renderMap(){
  const el=document.getElementById('tab-map');
  el.innerHTML='<h2 style="margin:16px 20px 8px">Network Map</h2><div id="map-container" style="padding:0 20px 20px"><svg id="map-svg" style="width:100%;height:700px;display:block;margin:0 auto"></svg></div>';
  try{
    const devs=await api('/devices');
    const results=[];
    for(const d of devs){
      try{const r=await api(`/devices/${d.id}/check`,{method:'POST'});results.push({device:d,status:r.status,error:null})}
      catch(e){results.push({device:d,status:null,error:e.message})}
    }
    const routerResult=results.find(r=>r.device.role==='router')||results[0];
    const otherResults=results.filter(r=>r!==routerResult);
    const ipMap={};
    for(const r of results){if(r.status?.ips)r.status.ips.forEach(ip=>ipMap[ip]=r)}
    const connections=[];
    for(const r of results){
      if(!r.status?.neighbors)continue;
      for(const nb of r.status.neighbors){
        if(nb.ip==='loopback'||nb.ip.startsWith('127.'))continue;
        const other=ipMap[nb.ip];
        if(other&&other.device.host!==r.device.host){
          const key=[r.device.id,other.device.id].sort().join('-');
          if(!connections.find(c=>c.key===key))connections.push({from:r,to:other,key,iface:nb.iface});
        }
      }
    }
    const W=960,H=700;
    let html=`<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="${H}" viewBox="0 0 ${W} ${H}">`;
    html+=`<defs>
      <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <linearGradient id="wan-grad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#f5b544"/><stop offset="100%" style="stop-color:#4da3ff"/></linearGradient>
      <linearGradient id="dev-body" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#2a3a5c"/><stop offset="100%" style="stop-color:#1a2540"/></linearGradient>
    </defs>`;
    const CX=W/2;
    // LAYOUT
    const I_Y=35; // Internet center Y
    const R_TOP=110; // Router top Y
    const R_H=70; // Router height
    const R_BOT=R_TOP+R_H; // Router bottom Y
    const LAN_Y=R_BOT+25; // LAN backbone Y
    const AP_TOP=LAN_Y+55; // AP top Y
    const AP_H=55; // AP height
    const AP_BOT=AP_TOP+AP_H; // AP bottom Y
    const PORT_ROW_Y=AP_BOT+20; // Port labels row Y
    const SPACING=180; // AP horizontal spacing
    const START_X=CX-(otherResults.length-1)*SPACING/2;
    const devicePositions={};
    // Draw all connections first (behind devices)
    // WAN: Internet -> router left side (wan port)
    html+=`<line x1="${CX}" y1="${I_Y+30}" x2="${CX-75}" y2="${R_TOP+15}" stroke="url(#wan-grad)" stroke-width="3" stroke-dasharray="8,4"/>`;
    // Device-to-device connections
    for(const conn of connections){
      const fp=devicePositions[conn.from.device.id]||{x:CX,y:R_BOT};
      const tp=devicePositions[conn.to.device.id]||{x:START_X,y:AP_BOT};
      const fx=conn.from===routerResult?CX:fp.x;
      const fy=conn.from===routerResult?R_BOT:fp.y+AP_H;
      const tx=conn.to===routerResult?CX:tp.x;
      const ty=conn.to===routerResult?R_TOP:tp.y;
      const mx=(fx+tx)/2,my=(fy+ty)/2;
      html+=`<line x1="${fx}" y1="${fy}" x2="${tx}" y2="${ty}" stroke="#39c07f" stroke-width="2" stroke-dasharray="5,3" opacity="0.7"/>`;
      html+=`<rect x="${mx-26}" y="${my-10}" width="52" height="16" rx="3" fill="#161d2e" stroke="#26314f"/>`;
      html+=`<text x="${mx}" y="${my+3}" text-anchor="middle" fill="#4da3ff" font-size="8" font-weight="600">${esc(conn.iface)}</text>`;
    }
    // LAN backbone
    html+=`<line x1="${CX-230}" y1="${LAN_Y}" x2="${CX+230}" y2="${LAN_Y}" stroke="#26314f" stroke-width="6" stroke-linecap="round"/>`;
    html+=`<text x="${CX}" y="${LAN_Y+16}" text-anchor="middle" fill="#4da3ff" font-size="10" font-weight="500">LAN Backbone</text>`;
    // Router to LAN
    html+=`<line x1="${CX}" y1="${R_BOT}" x2="${CX}" y2="${LAN_Y}" stroke="#4da3ff" stroke-width="2"/>`;
    // Internet cloud
    html+=`<ellipse cx="${CX}" cy="${I_Y}" rx="60" ry="28" fill="#0d1525" stroke="#4da3ff" stroke-width="2" filter="url(#glow)"/>`;
    html+=`<text x="${CX}" y="${I_Y-4}" text-anchor="middle" fill="#dbe4f5" font-size="13" font-weight="600">Internet</text>`;
    html+=`<text x="${CX}" y="${I_Y+14}" text-anchor="middle" fill="#4da3ff" font-size="14">☁</text>`;
    // Render router
    const r=routerResult,online=r.status&&r.status.online;
    html+=`<g transform="translate(${CX},${R_TOP})">`;
    // Antennas
    html+=`<line x1="-20" y1="-6" x2="-40" y2="-38" stroke="#4da3ff" stroke-width="2" opacity="0.7"/>`;
    html+=`<line x1="20" y1="-6" x2="40" y2="-38" stroke="#4da3ff" stroke-width="2" opacity="0.7"/>`;
    html+=`<circle cx="-40" cy="-38" r="4" fill="#4da3ff" opacity="0.9"/>`;
    html+=`<circle cx="40" cy="-38" r="4" fill="#4da3ff" opacity="0.9"/>`;
    // Main body
    html+=`<rect x="-80" y="0" width="160" height="${R_H}" rx="7" fill="url(#dev-body)" stroke="${online?'#39c07f':'#f4636e'}" stroke-width="2.5" filter="url(#glow)"/>`;
    // Top panel
    html+=`<rect x="-75" y="3" width="150" height="16" rx="3" fill="#0d1525"/>`;
    // LEDs
    html+=`<circle cx="-60" cy="11" r="3.5" fill="${online?'#39c07f':'#f4636e'}" filter="url(#glow)"/>`;
    html+=`<circle cx="-48" cy="11" r="3.5" fill="#4da3ff"/>`;
    html+=`<circle cx="-36" cy="11" r="3.5" fill="#f5b544"/>`;
    // Name
    html+=`<text x="0" y="36" text-anchor="middle" fill="#dbe4f5" font-size="12" font-weight="600">${esc(r.device.name)}</text>`;
    // IP + role
    html+=`<text x="0" y="52" text-anchor="middle" fill="#8b98b8" font-size="9">${esc(r.status?.ips?.[0]||r.device.host)} · ${esc(r.device.role||'router')}</text>`;
    // WAN IP label (right side)
    if(r.status?.ips&&r.status.ips.length>1){
      html+=`<text x="${80+8}" y="16" fill="#f5b544" font-size="9" font-weight="500">${esc(r.status.ips[r.status.ips.length-1])}</text>`;
    }
    html+=`</g>`;
    // Render APs
    for(let i=0;i<otherResults.length;i++){
      const dr=otherResults[i];
      const dx=START_X+i*SPACING;
      devicePositions[dr.device.id]={x:dx,y:AP_TOP};
      const dor=dr.status&&dr.status.online;
      // Vertical line from LAN to AP
      html+=`<line x1="${dx}" y1="${LAN_Y}" x2="${dx}" y2="${AP_TOP}" stroke="#4da3ff" stroke-width="2" opacity="0.7"/>`;
      // AP box
      html+=`<g transform="translate(${dx},${AP_TOP})">`;
      html+=`<rect x="-60" y="0" width="120" height="${AP_H}" rx="7" fill="url(#dev-body)" stroke="${dor?'#39c07f':'#f4636e'}" stroke-width="2" filter="url(#glow)"/>`;
      html+=`<circle cx="-48" cy="16" r="5" fill="${dor?'#39c07f':'#f4636e'}" filter="url(#glow)"/>`;
      html+=`<text x="0" y="20" text-anchor="middle" fill="#dbe4f5" font-size="11" font-weight="600">${esc(dr.device.name)}</text>`;
      html+=`<text x="0" y="37" text-anchor="middle" fill="#8b98b8" font-size="9">${esc(dr.status?.ips?.[0]||dr.device.host)}</text>`;
      html+=`<text x="0" y="49" text-anchor="middle" fill="#6b7898" font-size="8">${esc(dr.device.role||'device')}</text>`;
      html+=`</g>`;
    }
    // Port labels row - ALL ports in one horizontal line below devices
    // PORT ROWS - one per device, aligned under each device
    const PORT_W=42, PORT_H=16, PORT_GAP=55;
    // Collect ports per device
    const routerPorts=[];
    if(routerResult.status?.interfaces){
      Object.values(routerResult.status.interfaces).forEach(iface=>{
        if(iface.name!=='lo'&&iface.name!=='br-lan')routerPorts.push(iface.name);
      });
    }
    const apPortMap={};
    for(let i=0;i<otherResults.length;i++){
      const dx=START_X+i*SPACING;
      const dr=otherResults[i];
      const names=[];
      if(dr.status?.interfaces){
        Object.values(dr.status.interfaces).forEach(iface=>{
          if(iface.name!=='lo'&&iface.name!=='br-lan')names.push(iface.name);
        });
      }
      apPortMap[i]={x:dx,names};
    }
    // Draw router ports (between router and LAN)
    const RPORT_Y=R_BOT+18;
    if(routerPorts.length){
      const rw=(routerPorts.length-1)*PORT_GAP;
      const rx=CX-rw/2;
      routerPorts.forEach((name,i)=>{
        const px=rx+i*PORT_GAP;
        html+=`<rect x="${px-PORT_W/2}" y="${RPORT_Y-8}" width="${PORT_W}" height="${PORT_H}" rx="3" fill="#1a2540" stroke="#4da3ff" stroke-width="1.5"/>`;
        html+=`<text x="${px}" y="${RPORT_Y+3}" text-anchor="middle" fill="#4da3ff" font-size="8" font-weight="600">${esc(name)}</text>`;
        html+=`<line x1="${px}" y1="${RPORT_Y-8}" x2="${px}" y2="${R_BOT}" stroke="#4da3ff" stroke-width="1.5" opacity="0.5"/>`;
      });
    }
    // Draw AP port rows (below each AP)
    for(const [idx,ap] of Object.entries(apPortMap)){
      if(!ap.names.length)continue;
      const apIdx=parseInt(idx);
      const AP_PORT_Y=AP_BOT+18;
      const aw=(ap.names.length-1)*PORT_GAP;
      const ax=ap.x-aw/2;
      ap.names.forEach((name,i)=>{
        const px=ax+i*PORT_GAP;
        html+=`<rect x="${px-PORT_W/2}" y="${AP_PORT_Y-8}" width="${PORT_W}" height="${PORT_H}" rx="3" fill="#1a2540" stroke="#4da3ff" stroke-width="1.5"/>`;
        html+=`<text x="${px}" y="${AP_PORT_Y+3}" text-anchor="middle" fill="#4da3ff" font-size="8" font-weight="600">${esc(name)}</text>`;
        html+=`<line x1="${px}" y1="${AP_PORT_Y-8}" x2="${px}" y2="${AP_BOT}" stroke="#4da3ff" stroke-width="1.5" opacity="0.5"/>`;
      });
    }
    // WiFi signals below port row
    for(let i=0;i<otherResults.length;i++){
      const dr=otherResults[i];
      const dx=START_X+i*SPACING;
      if(dr.status?.wifi&&dr.status.wifi.length>0){
        const wy=PORT_ROW_Y+35;
        html+=`<path d="M${dx-25} ${wy} Q${dx} ${wy-18} ${dx+25} ${wy}" fill="none" stroke="#4da3ff" stroke-width="1.5" opacity="0.5"/>`;

async function fetchTrafficChart(id){
  const canvas=document.getElementById('dev-chart-'+id);
  if(!canvas)return;
  try{
    const r=await api(`/devices/${id}/traffic`);
    drawTrafficChart(canvas,r);
  }catch(e){canvas.style.display='none'}
}
function drawTrafficChart(canvas,data){
  const ctx=canvas.getContext('2d');
  const W=canvas.width,H=canvas.height;
  ctx.clearRect(0,0,W,H);
  if(data.length<2)return;
  // Sort by time
  data.sort((a,b)=>new Date(a.ts)-new Date(b.ts));
  // Find max for scaling
  const max=Math.max(...data.flatMap(d=>[d.rx,d.tx]));
  if(!max)return;
  // Draw RX and TX lines
  const drawLine=(key,color)=>{
    ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.beginPath();
    data.forEach((d,i)=>{
      const x=W*i/(data.length-1);
      const y=H-(d[key]/max)*H;
      if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    });
    ctx.stroke();
  };
  drawLine('rx','#4da3ff');
  drawLine('tx','#ff6b6b');
  // Labels
  ctx.fillStyle='var(--mut)';ctx.font='9px sans-serif';
  ctx.fillText('RX',4,12);ctx.fillText('TX',20,12);
}

  const d=document.createElement('div');

    <div class="row" style="justify-content:flex-end;gap:8px"><button class="act" id="sa-cancel">Cancel</button><button class="act pri" id="sa-ok">OK</button></div></div>`;
  document.body.appendChild(d);
  const sel=d.querySelector('#sa-sel');
  const ok=()=>{const v=sel.value;d.remove();onOk(v)};
  d.querySelector('#sa-ok').onclick=ok;

  <h3 style="margin-top:20px">Recent alerts</h3><div id="al-log"></div>`;
  const v=id=>document.getElementById(id).value;
  document.getElementById('al-save').onclick=async()=>{
    const b=id=>document.getElementById(id).checked;
    const next={min_severity:v('al-min'),channels:{
      dashboard:b('al-dash'),
      email:{enabled:b('al-em-en'),smtp_host:v('al-em-host'),smtp_port:parseInt(v('al-em-port'))||587,use_tls:true,user:v('al-em-user'),password:v('al-em-pass'),from:v('al-em-from'),to:v('al-em-to')},
      telegram:{enabled:b('al-tg-en'),token:v('al-tg-token'),chat_id:v('al-tg-chat')},
      webhook:{enabled:b('al-wh-en'),url:v('al-wh-url')}}};
    await api('/alerts/config',{method:'PUT',body:JSON.stringify(next)});
    toast('Alerting config saved');
  };
  (async()=>{const log=await api('/alerts/log');
    document.getElementById('al-log').innerHTML=log.length?
      `<table><tr><th>Time</th><th>Device</th><th>Severity</th><th>Message</th><th>Channels</th></tr>`+
      log.map(l=>`<tr><td class="small">${esc(l.ts)}</td><td>${esc(l.device)}</td><td><span class="badge b-${l.severity}">${l.severity}</span></td><td>${esc(l.message)}</td><td class="small">${esc(l.channels)}</td></tr>`).join('')+`</table>`
      :'<p class="muted">No alerts logged yet.</p>'})();
}

render('devices');
function toggleTheme(){document.body.classList.toggle('light')}
// ponytail: auto-refresh every 60s on devices tab
startPolling(60000);

// Bulk actions
function toggleAll(checked){
  document.querySelectorAll('.bulk-cb').forEach(cb=>cb.checked=checked);
  updateBulkBtn();
}
function updateBulkBtn(){
  const sel=document.querySelectorAll('.bulk-cb:checked').length;
  const btns=document.querySelectorAll('.bulk-action-btn');
  btns.forEach(b=>b.disabled=sel===0);
}
async function bulkAction(action){
  const ids=[...document.querySelectorAll('.bulk-cb:checked')].map(cb=>parseInt(cb.dataset.id));
  if(!ids.length) return;
  const r=await api('/bulk',{method:'POST',body:JSON.stringify({ids,action})});
  toast(`${r.results.filter(x=>x.ok).length}/${r.results.length} ${action}s done`);
  renderDevices();
}
async function showConfigHistory(did){
  const hist=await api(`/devices/${did}/config-history`);
  if(!hist.length){toast('No config history');return;}
  let html=`<div style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:1000;display:flex;align-items:center;justify-content:center">
    <div style="background:var(--bg);padding:20px;border-radius:8px;max-width:600px;width:90%;max-height:80vh;overflow:auto">
      <h3>Config History</h3>
      <table style="width:100%;font-size:12px">
        <tr><th>Time</th><th>Changes</th></tr>`;
  hist.forEach(h=>{
    const changes=h.files.filter(f=>f.includes('='));
    html+=`<tr><td class="small">${esc(h.ts)}</td><td>${changes.map(c=>`<div>${esc(c)}</div>`).join('')}</td></tr>`;
  });
  html+=`</table><button class="act" style="margin-top:12px" onclick="this.closest('div[style*=fixed]').remove()">Close</button></div></div>`;
  document.body.insertAdjacentHTML('beforeend',html);
}
async function renderLogs(){
  const el=document.getElementById('tab-logs');
  const devs=await api('/devices');
  let html=`<h2>Device Logs</h2>
    <div class="card"><select id="log-dev" style="width:200px">
      ${devs.map(d=>`<option value="${d.id}">${esc(d.name)} (${esc(d.host)})</option>`).join('')}
    </select>
    <button class="act" onclick="loadLogs()">Load Logs</button>
    </div>
    <div id="log-out" style="margin-top:16px"><p class="muted">Select a device and click Load Logs.</p></div>`;
  el.innerHTML=html;
}
async function loadLogs(){
  const did=parseInt(document.getElementById('log-dev').value);
  const out=document.getElementById('log-out');
  out.innerHTML='<p class="muted">Loading…</p>';
  try{
    const logs=await api(`/devices/${did}/logs`);
    if(!logs.length){out.innerHTML='<p class="muted">No logs yet. Check a device first.</p>';return;}
    out.innerHTML=`<table><tr><th>Time</th><th>Message</th></tr>`+
      logs.map(l=>`<tr><td class="small">${esc(l.ts)}</td><td style="font-family:monospace;font-size:11px">${esc(l.message)}</td></tr>`).join('')+
      '</table>';
  }catch(e){out.innerHTML=`<p style="color:var(--bad)">Error: ${esc(e.message)}</p>`}

async function renderVlans(){
  const el=document.getElementById('tab-vlans');
  const devs=await api('/devices');
  const router=devs.find(d=>d.role==='router')||devs[0];
  let html=`<h2>VLAN Configuration</h2>
    <p class="muted">Create and manage VLANs across your network. Each VLAN isolates devices into separate broadcast domains.</p>
    <div class="card">
      <h3>Create New VLAN</h3>
      <div class="row" style="margin-bottom:12px">
        <div><label>VLAN ID</label><input id="vlan-id" type="number" min="1" max="4094" value="10" style="width:80px"></div>
        <div style="flex:1"><label>Name / Description</label><input id="vlan-name" placeholder="e.g. Office Devices" style="width:100%"></div>
      </div>
      <div class="row" style="margin-bottom:12px">
        <div><label>Subnet</label><input id="vlan-subnet" placeholder="192.168.10.0/24" style="width:180px"></div>
        <div style="display:flex;align-items:flex-end">
          <label style="margin:0 8px 0 0"><input type="checkbox" id="vlan-dhcp" checked> Enable DHCP</label>
        </div>
        <div style="flex:1"><label>Router Device</label><select id="vlan-router" style="width:100%">${devs.map(d=>`<option value="${d.id}" ${d.id===router?.id?'selected':''}>${esc(d.name)} (${esc(d.host)})</option>`).join('')}</select></div>
      </div>
      <div style="margin-bottom:12px">
        <label>Member Devices</label>
        <div id="vlan-devices" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">
          ${devs.map(d=>`<label style="display:flex;align-items:center;gap:4px"><input type="checkbox" class="vlan-dev-cb" value="${d.id}"> ${esc(d.name)} (${esc(d.host)})</label>`).join('')}
        </div>
      </div>
      <button class="act pri" onclick="applyVlan()">Apply VLAN</button>
    </div>
    <div id="vlan-results" style="margin-top:16px"></div>`;
  el.innerHTML=html;
}
async function applyVlan(){
  const dids=[...document.querySelectorAll('.vlan-dev-cb:checked')].map(cb=>parseInt(cb.value));
  if(!dids.length){toast('Select at least one device',true);return}
  const vlan_id=parseInt(document.getElementById('vlan-id').value);
  const name=document.getElementById('vlan-name').value||'vlan_'+vlan_id;
  const subnet=document.getElementById('vlan-subnet').value||'192.168.'+vlan_id+'.0/24';
  const dhcp=document.getElementById('vlan-dhcp').checked;
  const router_id=parseInt(document.getElementById('vlan-router').value);
  try{
    toast('Applying VLAN '+vlan_id+'...');
    const r=await api('/vlans/apply',{method:'POST',body:JSON.stringify({vlan_id,name,subnet,dhcp,devices:dids,router_id})});
    const ok=r.results.filter(x=>x.ok).length;
    const fail=r.results.filter(x=>!x.ok).length;
    document.getElementById('vlan-results').innerHTML=`<div class="card" style="border-color:var(--ok)"><strong>VLAN applied</strong><br>${ok} devices configured successfully${fail?', '+fail+' failed':''}</div>`;
    toast('VLAN '+vlan_id+' applied');
  }catch(e){
    document.getElementById('vlan-results').innerHTML=`<div class="card" style="border-color:var(--bad)"><strong>Failed</strong><br>${esc(String(e))}</div>`;
    toast(String(e),true);
  }
}
}
</script>
</body>
</html>
