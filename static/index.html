<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>owctl — OpenWrt control</title>
<style>
:root{--bg:#0f1420;--panel:#161d2e;--panel2:#1c2540;--tx:#dbe4f5;--mut:#8b98b8;--acc:#4da3ff;--ok:#39c07f;--warn:#f5b544;--bad:#f4636e;--crit:#ff5470;--line:#26314f}
.light{--bg:#f0f2f5;--panel:#fff;--panel2:#e8eaf0;--tx:#1a1a2e;--mut:#6b7280;--acc:#2563eb;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--crit:#e11d48;--line:#d1d5db}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
/* login gate */
#login-gate{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:var(--bg);padding:24px}
#login-gate[hidden]{display:none}
.lg-box{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:26px 24px;text-align:center}
.lg-logo{font-size:40px;line-height:1;margin-bottom:6px}
.lg-box h1{font-size:24px;margin:2px 0 4px;font-weight:650}
.lg-box h1 span{color:var(--acc)}
.lg-sub{color:var(--mut);font-size:13px;margin:0 0 16px}
.lg-body{display:flex;flex-direction:column;gap:10px}
#login-pass{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--line);
  background:var(--panel2);color:var(--tx);font-size:14px;text-align:center}
#login-pass:focus{outline:2px solid var(--acc);border-color:transparent}
.lg-err{color:var(--bad);font-size:12.5px;min-height:1em;margin:-4px 0 0}
.lg-btn{width:100%;padding:10px 12px;border-radius:9px;border:none;cursor:pointer;
  background:var(--acc);color:#08101e;font-size:14px;font-weight:600}
.lg-btn:hover{filter:brightness(1.06)}
.lg-hint{color:var(--mut);font-size:11.5px;margin:14px 0 0;line-height:1.5}
.lg-hint code{color:var(--acc)}
/* generic section panel (e.g. Users tab) */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.panel h2{margin:0 0 12px;font-size:17px}
header{display:flex;align-items:center;gap:14px;padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0;font-weight:600}
header h1 span{color:var(--acc)}
nav{display:flex;gap:4px;margin-left:20px}
nav button{background:none;border:0;color:var(--mut);padding:8px 12px;cursor:pointer;border-radius:8px;font-size:14px}
nav button.on{background:var(--panel2);color:var(--tx)}
.subtabs{display:inline-flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.subtabs button{background:none;border:0;color:var(--mut);padding:6px 14px;cursor:pointer;border-radius:7px;font-size:13px}
.subtabs button.on{background:var(--panel2);color:var(--tx);font-weight:600}
main{padding:18px 20px;max-width:1200px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.card h3{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.kv{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed #222c47;font-size:13px}
.kv span:first-child{color:var(--mut)}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600}
.b-online{background:#123527;color:var(--ok)} .b-offline{background:#3a1520;color:var(--bad)}
.b-unknown{background:#2a2f42;color:var(--mut)}
.b-INFO{background:#2a2f42;color:var(--mut)} .b-LOW{background:#123527;color:var(--ok)}
.b-MEDIUM{background:#3a2f12;color:var(--warn)} .b-HIGH{background:#3a1520;color:var(--bad)}
.b-CRITICAL{background:#4a1020;color:var(--crit)}
.b-bad{background:#4a1020;color:var(--crit)} .b-error{background:#4a1020;color:var(--crit)}
.bad{color:var(--bad)}
button.act{background:var(--panel2);color:var(--tx);border:1px solid var(--line);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px}
.act[style*="flex-direction:column"]{flex-direction:column;align-items:flex-start;text-align:left;min-width:140px;padding:10px 12px}
button.act:hover{border-color:var(--acc)}
button.pri{background:#1c4d8f;border-color:#2f6fc0}
input,select{background:#0d1322;border:1px solid var(--line);color:var(--tx);padding:7px 10px;border-radius:8px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label{color:var(--mut);font-size:12px;display:block;margin-bottom:3px}
.fsec{margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid #222c47}
th{color:var(--mut);font-weight:500}
.small{color:var(--mut);font-size:12px}
.finding{border-left:3px solid var(--acc);padding:8px 12px;background:var(--panel2);border-radius:8px;margin:8px 0}
.finding.MEDIUM{border-color:var(--warn)} .finding.HIGH{border-color:var(--bad)} .finding.CRITICAL{border-color:var(--crit)} .finding.INFO,.finding.LOW{border-color:var(--mut)}
pre{background:#0b111e;border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;font-size:12px;max-height:300px}
.muted{color:var(--mut)}
.pill{font-size:11px;color:var(--mut)}
#toast{position:fixed;right:16px;bottom:16px;background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:10px;display:none;z-index:9}
/* ---- Network Map (theme-safe) ---- */
.map-wrap{position:relative;padding:0 20px 20px}
.map-stage{position:relative;width:100%;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg)}
#map-svg{display:block;width:100%;height:620px;cursor:grab;touch-action:none}
#map-svg:active{cursor:grabbing}
.map-node{cursor:pointer}
.map-node:hover .node-body{filter:drop-shadow(0 0 7px var(--acc));stroke-width:2.4}
.node-body{stroke-width:1.6;transition:filter .12s,stroke-width .12s}
.node-router{fill:var(--panel2)}
.node-ap,.node-wired{fill:var(--panel)}
.node-on{stroke:var(--ok)}
.node-off{stroke:var(--bad)}
.dot-on{fill:var(--ok)}
.dot-off{fill:var(--bad)}
.node-name{fill:var(--tx);font-weight:600;font-family:system-ui,Segoe UI,Roboto,sans-serif}
.node-sub{fill:var(--mut);font-family:system-ui,Segoe UI,Roboto,sans-serif}
.map-link{stroke:var(--mut);stroke-width:2;fill:none;opacity:.8}
.map-link.off{stroke:var(--bad);opacity:.55;stroke-dasharray:5,4}
.link-label-bg{fill:var(--panel);stroke:var(--line)}
.link-label{fill:var(--tx);font-weight:600;font-size:10px;font-family:system-ui,Segoe UI,Roboto,sans-serif}
.legend-box{fill:var(--panel);stroke:var(--line)}
.legend-text{fill:var(--mut);font-family:system-ui,Segoe UI,Roboto,sans-serif}
.map-ctrl{position:absolute;top:12px;right:12px;display:flex;gap:6px;z-index:15}
.map-ctrl button{background:var(--panel2);border:1px solid var(--line);color:var(--tx);width:34px;height:34px;border-radius:9px;cursor:pointer;font-size:16px;line-height:1}
.map-ctrl button:hover{border-color:var(--acc)}
.map-hint{position:absolute;left:12px;bottom:10px;color:var(--mut);font-size:11px;z-index:15}
</style>
</head>
<body>
<div id="login-gate">
  <div class="lg-box">
    <div class="lg-logo">🛰️</div>
    <h1>ow<span>ctl</span></h1>
    <p class="lg-sub">OpenWrt control + threat watch — sign in with your account.</p>
    <div class="lg-body">
      <input id="login-user" type="text" placeholder="Username"
             autocomplete="username" autocapitalize="none" spellcheck="false"
             aria-label="username"
             onkeydown="if(event.key==='Enter'){event.preventDefault();document.getElementById('login-pass').focus()}"/>
      <input id="login-pass" type="password" placeholder="Password"
             autocapitalize="off" spellcheck="false" autocomplete="current-password"
             aria-label="password"
             onkeydown="if(event.key==='Enter'){event.preventDefault();tryLogin()}"/>
      <div id="login-err" class="lg-err" role="alert"></div>
      <button type="button" class="lg-btn" onclick="tryLogin()">Sign in</button>
    </div>
    <p class="lg-hint">On first boot, pick your admin password. Sessions last 24h and
    are stored only in this browser; the server forgets them on restart.</p>
  </div>
</div>
<header>
  <h1>ow<span>ctl</span> <span class="pill">OpenWrt control + threat watch</span></h1>
  <nav>
    <button data-tab="network" class="on">Home</button>
     <button data-tab="devices">Devices</button>
     <button data-tab="threats">Threats</button>
     <button data-tab="alerts">Alerting</button>
     <button data-tab="map">Network Map</button>
     <button data-tab="net">Network</button>
     <button data-tab="logs">Device Logs</button>
     <button data-tab="users" class="adm-only" style="display:none">Users</button>
  </nav>
  <button class="act" id="theme-btn" onclick="toggleTheme()" title="Toggle theme" style="margin-left:auto">🌓</button>
</header>
<main style="display:none">
  <section id="tab-network"></section>
  <section id="tab-devices" style="display:none"></section>
  <section id="tab-threats" style="display:none"></section>
  <section id="tab-sweep" style="display:none"></section>
  <section id="tab-alerts" style="display:none"></section>
  <section id="tab-map" style="display:none"></section>
  <section id="tab-net" style="display:none"></section>
  <section id="tab-wifi" style="display:none"></section>
  <section id="tab-logs" style="display:none"></section>
  <section id="tab-users" style="display:none"></section>
</main>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let TOKEN=localStorage.getItem('owctl_session')||'';
let ROLE=localStorage.getItem('owctl_role')||'';
async function api(path,opts={}){
  opts.headers=Object.assign({'Content-Type':'application/json'},opts.headers||{});
  if(TOKEN)opts.headers['Authorization']='Bearer '+TOKEN;
  const r=await fetch('/api'+path,opts);
  if(r.status===401){showLogin('Session token rejected — sign in again');throw new Error('unauthorized')}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.detail||j.error||r.status);
  return j;
}
function toast(m,bad){const t=$('#toast');t.textContent=m;t.style.display='block';t.style.borderColor=bad?'var(--bad)':'var(--line)';setTimeout(()=>t.style.display='none',4000)}
const navBtns=[...document.querySelectorAll('nav button')];
navBtns.forEach(b=>b.onclick=()=>{
  navBtns.forEach(x=>x.classList.toggle('on',x===b));
  navBtns.forEach(btn=>{
    const tabId='tab-'+btn.dataset.tab;
    const tab=document.getElementById(tabId);
    if(tab)tab.style.display=(btn===b)?'':'none';
  });
  render(b.dataset.tab);
});
function render(tab){
  if(tab==='network')return renderNetwork();
  if(tab==='devices')return renderDevices();
  if(tab==='threats')return renderThreats();
  if(tab==='sweep')return renderSweep();
  if(tab==='alerts')return renderAlerts();
  if(tab==='map')return renderMap();
  if(tab==='logs')return renderLogs();
  if(tab==='net')return renderNet();
  if(tab==='wifi')return renderWifi();
  if(tab==='users')return renderUsers();
}
function fmtUptime(s){if(!s&&s!==0)return '—';const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return (d?d+'d ':'')+h+'h '+m+'m'}
function fmtKB(k){return k>1048576?(k/1048576).toFixed(1)+' GB':(k/1024).toFixed(0)+' MB'}

async function renderNetwork() {
  const host = document.getElementById('tab-network');
  host.innerHTML = '<p class="muted">Loading network status...</p>';
  try {
    const net = await api('/network');
    const statusColor = net.status === 'online' ? 'var(--ok)' : (net.status === 'degraded' ? 'var(--warn)' : 'var(--bad)');
    
    let html = `<div class="row" style="justify-content:space-between;margin-bottom:16px">
      <h2 style="margin:0">Network Status: <span style="color:${statusColor}">${net.status.toUpperCase()}</span></h2>
      <div class="row">
        <button class="act" onclick="networkBulk('check')">Check all</button>
        <button class="act" onclick="networkBulk('backup')">Backup all</button>
        <button class="act" onclick="networkBulk('reboot')">Reboot all</button>
      </div>
    </div>`;

    html += `<div class="grid" style="margin-bottom:20px">`;
    const gw = net.gateway;
    html += `<div class="card">
      <h3>Gateway ${net.gateway_missing ? '<span class="badge b-CRITICAL">MISSING</span>' : ''}</h3>
      ${gw ? `
        <div class="kv"><span>Name</span><strong>${esc(gw.name)}</strong></div>
        <div class="kv"><span>Host</span><span>${esc(gw.host)}</span></div>
        <div class="kv"><span>Status</span><span class="badge b-${gw.status}">${gw.status}</span></div>
        <div class="kv"><span>Firmware</span><span class="small">${esc(gw.firmware)}</span></div>
        <div class="kv"><span>Uptime</span><span>${fmtUptime(gw.uptime_s)}</span></div>
      ` : '<p class="muted">No gateway set. Assign one in the table below.</p>'}
    </div>`;

    html += `<div class="card">
      <h3>Totals</h3>
      <div class="kv"><span>Devices</span><span>${net.totals.online} online / ${net.totals.devices} total</span></div>
      <div class="kv"><span>Clients</span><span>${net.totals.clients || 0}</span></div>
      <div class="kv"><span>Traffic</span><span>RX ${net.totals.rx_mbps.toFixed(1)} Mbps / TX ${net.totals.tx_mbps.toFixed(1)} Mbps</span></div>
      <div class="row" style="margin-top:8px">
        ${Object.entries(net.totals.findings).filter(([_,v])=>v>0).map(([k,v])=>`<span class="badge b-${k}" style="margin-right:4px">${v} ${k}</span>`).join('')}
      </div>
    </div>`;
    html += `</div>`;

    html += `<h3>Devices</h3>
    <div class="card" style="padding:0;overflow:hidden">
    <table>
      <thead><tr><th>Device</th><th>Host</th><th>Role</th><th>Status</th><th>Clients</th><th>Uptime</th><th></th></tr></thead>
      <tbody>
        ${net.devices.map(d => `
          <tr style="cursor:pointer" onclick="networkDrill(${d.id})">
            <td><strong>${esc(d.name)}</strong>${net.gateway && net.gateway.id === d.id ? ' <span class="pill">(Gateway)</span>' : ''}</td>
            <td class="small">${esc(d.host)}</td>
            <td class="small">${esc(d.role)}</td>
            <td><span class="badge b-${d.status}">${d.status}</span></td>
            <td>${d.clients ?? '—'}</td>
            <td class="small">${fmtUptime(d.uptime_s)}</td>
            <td onclick="event.stopPropagation()">
              ${(net.gateway && net.gateway.id === d.id) ? '' : `<button class="act pill" onclick="setGateway(${d.id})">Set as gateway</button>`}
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
    </div>
    <div id="network-detail" style="margin-top:20px"></div>`;

    html += `<div class="grid" style="margin-top:20px">
      <div class="card">
        <h3>Recent Offline</h3>
        ${net.recent_offline.length ? net.recent_offline.map(r => `<div class="kv"><span>${esc(r.device_name)}</span><span class="bad">${fmtUptime(r.offline_seconds)} ago</span></div>`).join('') : '<p class="muted">None.</p>'}
      </div>
    </div>`;
    host.innerHTML = html;
  } catch(e) { host.innerHTML = `<p class="bad">Error: ${esc(e.message)}</p>`; }
}

async function networkBulk(action) {
  toast(`Running ${action} on all devices...`);
  try {
    const devs = await api('/devices');
    const ids = devs.map(d => d.id);
    const r = await api('/bulk', {method:'POST', body:JSON.stringify({ids, action})});
    const host = document.getElementById('network-detail');
    host.innerHTML = `<h3>Bulk ${action} results</h3>
    <div class="card">
      ${r.results.map(res => `
        <div class="row" style="justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0">
          <span>${esc(res.name)}</span>
          <div class="row">
            ${res.ok ? '<span class="badge b-online">OK</span>' : `<span class="badge b-bad">FAIL</span> <span class="small bad">${esc(res.error)}</span>`}
          </div>
        </div>
      `).join('')}
      <div class="row fsec"><button class="act" onclick="this.closest('.card').parentElement.innerHTML=''">Close</button></div>
    </div>`;
  } catch(e) { toast(String(e), true); }
}

async function networkDrill(id) {
  toast('Fetching status...');
  try {
    const r = await api(`/devices/${id}/check`, {method:'POST'});
    const host = document.getElementById('network-detail');
    host.innerHTML = `<h3>${esc(r.status.name)} Detail</h3><div id="devinfo-${id}" class="card"></div>`;
    showDevInfo(id, r.status);
    host.scrollIntoView({behavior:'smooth'});
  } catch(e) { toast(String(e), true); }
}

async function setGateway(id) {
  try {
    await api('/settings', {method:'PUT', body:JSON.stringify({network_gateway: id})});
    toast('Gateway updated');
    renderNetwork();
  } catch(e) { toast(String(e), true); }
}

/* ─────────────────────────── Network tab (VLAN · QoS · Firewall · WiFi) ──
   ponytail: one tab groups all per-device network config so the home page
   stays a summary. Sub-panels are lazy: each calls its existing render fn
   against its own section element. */
let _currentNetSection = null;

async function renderNet(activeSection){
  const el=document.getElementById('tab-net');
  _currentNetSection = activeSection || _currentNetSection;
  let html=`<h2>Network</h2>
    <p class="muted">Click a subject to view and configure.</p>
    <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:16px">
      <span></span>
      <button class="act" onclick="setNetAdvanced(!NET_ADVANCED);renderNet(_currentNetSection)">
        ${NET_ADVANCED ? '← Simple' : 'Advanced →'}
      </button>
    </div>
    <div class="grid" style="margin-bottom:24px">
      <div class="card" style="cursor:pointer;border-color:${_currentNetSection==='vlans'?'var(--pri)':'var(--line)'}" onclick="loadNetSection('vlans')">
        <h3>VLANs <span class="pill">→</span></h3>
        <p class="small muted">Subnets, isolation and tagging.</p>
      </div>
      <div class="card" style="cursor:pointer;border-color:${_currentNetSection==='dhcp'?'var(--pri)':'var(--line)'}" onclick="loadNetSection('dhcp')">
        <h3>DHCP <span class="pill">→</span></h3>
        <p class="small muted">IP pools, lease times and static leases.</p>
      </div>
      <div class="card" style="cursor:pointer;border-color:${_currentNetSection==='dns'?'var(--pri)':'var(--line)'}" onclick="loadNetSection('dns')">
        <h3>DNS <span class="pill">→</span></h3>
        <p class="small muted">Upstream resolvers and search domains.</p>
      </div>
      <div class="card" style="cursor:pointer;border-color:${_currentNetSection==='qos'?'var(--pri)':'var(--line)'}" onclick="loadNetSection('qos')">
        <h3>QoS / SQM <span class="pill">→</span></h3>
        <p class="small muted">Traffic shaping and latency priority.</p>
      </div>
      <div class="card" style="cursor:pointer;border-color:${_currentNetSection==='firewall'?'var(--pri)':'var(--line)'}" onclick="loadNetSection('firewall')">
        <h3>Firewall <span class="pill">→</span></h3>
        <p class="small muted">Port forwards, zone rules and policies.</p>
      </div>
      <div class="card" style="cursor:pointer;border-color:${_currentNetSection==='wifi'?'var(--pri)':'var(--line)'}" onclick="loadNetSection('wifi')">
        <h3>WiFi <span class="pill">→</span></h3>
        <p class="small muted">SSIDs, encryption and configuration clone.</p>
      </div>
    </div>
    <div id="net-detail"></div>`;
  el.innerHTML=html;

  if(_currentNetSection){
    loadNetSection(_currentNetSection);
  }
}

async function loadNetSection(name){
  _currentNetSection = name;
  // Update card borders
  document.querySelectorAll('#tab-net .grid .card').forEach(c=>{
    c.style.borderColor='var(--line)';
  });
  event?.currentTarget?.style && (event.currentTarget.style.borderColor='var(--pri)');
  
  const box=document.getElementById('net-detail');
  if(!box)return;
  box.innerHTML='<p class="muted">Loading…</p>';

  if(name==='vlans'){
    await renderVlans(box);
  }else if(name==='dhcp'){
    await renderDhcp(box);
  }else if(name==='dns'){
    await renderDns(box);
  }else if(name==='qos'){
    await renderQos(box);
  }else if(name==='firewall'){
    await renderFirewall(box);
  }else if(name==='wifi'){
    await renderWifi(box);
  }
}

async function renderDevices(){
  const devs=await api('/devices');
  const host=document.getElementById('tab-devices');
  let html=`
  <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:12px">
    <div class="subtabs" id="dev-subtabs">
      <button data-sub="devices" class="on" onclick="switchDevSub('devices')">Devices (${devs.length})</button>

async function applyNetTemplate(type, tplId){
  const tpl = (NET_TEMPLATES[type]||[]).find(t=>t.id===tplId);
  if(!tpl)return;
  if(!confirm(`Apply "${tpl.label}" template?\n${tpl.desc}`))return;
  try{
    if(type==='vlans'){
      // Need to select router and devices - open a mini modal
      applyVlanTemplate(tpl.payload);
    }else if(type==='qos'){
      // Apply to first SSH device or selected
      applyQosTemplate(tpl.payload);
    }else if(type==='firewall'){
      applyFirewallTemplate(tpl.payload);
    }else if(type==='wifi'){
      applyWifiTemplate(tpl.payload);
    }else if(type==='dhcp'){
      applyDhcpTemplate(tpl.payload);
    }else if(type==='dns'){
      applyDnsTemplate(tpl.payload);
    }
  }catch(e){toast(String(e),true)}
}

async function renderMap(){
  const el=document.getElementById('tab-map');
  el.innerHTML='<h2 style="margin:16px 20px 8px">Network Map</h2>'+
    '<div class="map-wrap"><div class="map-stage" id="map-stage">'+
    '<div class="map-ctrl">'+
    '<button id="map-zin" title="Zoom in">+</button>'+
    '<button id="map-zout" title="Zoom out">−</button>'+
    '<button id="map-fit" title="Fit">⤢</button>'+
    '</div>'+
    '<svg id="map-svg"></svg>'+
    '<div class="map-hint">Click a device for details · drag to pan · scroll to zoom</div>'+
    '</div></div>';
  const svg=el.querySelector('#map-svg');
  const stage=el.querySelector('#map-stage');
  try{
    const devs=await api('/devices');
    const results=[];
    for(const d of devs){
      try{const r=await api(`/devices/${d.id}/check`,{method:'POST'});results.push({device:d,status:r.status,error:null})}
      catch(e){results.push({device:d,status:null,error:e.message})}
    }
    if(!results.length){svg.outerHTML='<p style="padding:30px;color:var(--mut)">No devices added yet.</p>';return;}
    const router=results.find(r=>r.device.role==='router')||results[0];
    const others=results.filter(r=>r!==router);
    const ipMap={};
    for(const r of results){if(r.status&&r.status.ips)r.status.ips.forEach(ip=>ipMap[ip]=r);}
    // Build unique, directional links from neighbor data
    const seen={},links=[];
    for(const r of results){
      if(!r.status||!r.status.neighbors)continue;
      for(const nb of r.status.neighbors){
        if(nb.ip==='loopback'||String(nb.ip).startsWith('127.'))continue;
        const o=ipMap[nb.ip];
        if(!o||o.device.id===r.device.id)continue;
        const key=[r.device.id,o.device.id].sort().join('-');
        if(seen[key])continue;
        seen[key]=1;
        links.push({a:r,b:o,iface:nb.iface});
      }
    }
    // ---- Layout: router top-center, connected children fanned below, others in a second row ----
    const nodeW=172,nodeH=58,gap=26;
    const connected=new Set(links.flatMap(l=>[l.a.device.id,l.b.device.id]));
    const children=others.filter(r=>connected.has(r.device.id));
    const orphans=others.filter(r=>!connected.has(r.device.id));
    const childrenX=children.map((_,i)=>(i-(children.length-1)/2)*(nodeW+gap));
    const orphansX=orphans.map((_,i)=>(i-(orphans.length-1)/2)*(nodeW+gap));
    const routerX=0,routerY=0;
    const row1Y=150,row2Y=300;
    const pos={};
    pos[router.device.id]={x:routerX,y:routerY,type:'router'};
    children.forEach((r,i)=>pos[r.device.id]={x:childrenX[i],y:row1Y,type:r.device.role==='ap'?'ap':'wired'});
    orphans.forEach((r,i)=>pos[r.device.id]={x:orphansX[i],y:row2Y,type:r.device.role==='ap'?'ap':'wired'});
    const xvals=Object.values(pos).map(p=>p.x);
    const minx=Math.min(0,...xvals),maxx=Math.max(0,...xvals);
    const topPad=90,botPad=70;
    const maxy=Math.max(row1Y,orphans.length?row2Y:row1Y);
    const padL=60,padR=60;
    const ox=minx-padL, oy=topPad;
    const vbW=(maxx-minx)+nodeW+padL+padR;
    const vbH=(maxy-topPad+nodeH)+botPad;
    svg.setAttribute('viewBox',`${ox} ${oy} ${vbW} ${vbH}`);

    let s='';
    s+='<defs>'+
      '<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">'+
        '<path d="M0,0 L10,5 L0,10 z" class="map-link" style="opacity:1;fill:var(--mut)"/></marker>'+
      '</defs>';
    // ---- Links (curved, each labeled with its interface) ----
    for(const l of links){
      const a=pos[l.a.device.id],b=pos[l.b.device.id];
      const ax=a.x+nodeW/2, ay=a.y+nodeH;
      const bx=b.x+nodeW/2, by=b.y;
      const off=(b.x>ax?1:-1)*26;
      const path=`M ${ax} ${ay} C ${ax} ${ay+42}, ${bx} ${by-42}, ${bx} ${by-7}`;
      const offlink=!(l.b.status&&l.b.status.online);
      s+=`<path d="${path}" class="map-link${offlink?' off':''}" marker-end="url(#arrow)"/>`;
      // label at the cubic-bezier midpoint (t=0.5)
      const t=0.5,mt=1-t;
      const mx=mt*mt*mt*ax+3*mt*mt*t*ax+3*mt*t*t*bx+t*t*t*bx;
      const my=mt*mt*mt*ay+3*mt*mt*t*(ay+42)+3*mt*t*t*(by-42)+t*t*t*(by-7);
      const txt=l.iface||'';
      const w=txt.length*5.6+14;
      s+=`<g><rect x="${mx-w/2}" y="${my-10}" width="${w}" height="20" rx="6" class="link-label-bg"/>`+
         `<text x="${mx}" y="${my+4}" text-anchor="middle" class="link-label">${esc(txt)}</text></g>`;
    }
    // ---- Nodes ----
    const node=(r,p)=>{
      const on=!!(r.status&&r.status.online);
      const x=p.x,y=p.y;
      const id=r.device.id;
      const role=p.type==='router'?'Router':(p.type==='ap'?'Access point':'Wired device');
      const ip=(r.status&&r.status.ips&&r.status.ips[0])||r.device.host;
      const sub=p.type==='router'?(r.device.role||'router'):role;
      // AP client count chip
      const clients=r.status&&r.status.clients?r.status.clients:0;
      let g=`<g class="map-node" data-id="${id}" data-role="${esc(sub)}" data-on="${on?'1':'0'}" data-ip="${esc(ip)}" data-name="${esc(r.device.name)}" data-clients="${clients}" transform="translate(${x},${y})">`;
      g+=`<rect x="0" y="0" width="${nodeW}" height="${nodeH}" rx="12" class="node-body node-${p.type} ${on?'node-on':'node-off'}"/>`;
      g+=`<circle cx="18" cy="${nodeH/2}" r="5.5" class="${on?'dot-on':'dot-off'}"/>`;
      g+=`<text x="34" y="${nodeH/2-3}" class="node-name" font-size="13">${esc(r.device.name)}</text>`;
      g+=`<text x="34" y="${nodeH/2+13}" class="node-sub" font-size="11">${esc(ip)}</text>`;
      g+=`</g>`;
      return g;
    };
    results.forEach(r=>s+=node(r,pos[r.device.id]));
    // ---- Legend ----
    const lx=ox+14,ly=oy+vbH-24;
    s+=`<rect x="${lx-6}" y="${ly-16}" width="330" height="26" rx="7" class="legend-box"/>`;
    s+=`<circle cx="${lx+8}" cy="${ly-3}" r="5" class="dot-on"/>`;
    s+=`<text x="${lx+18}" y="${ly+1}" class="legend-text" font-size="11">Online</text>`;
    s+=`<circle cx="${lx+78}" cy="${ly-3}" r="5" class="dot-off"/>`;
    s+=`<text x="${lx+88}" y="${ly+1}" class="legend-text" font-size="11">Offline</text>`;
    s+=`<text x="${lx+150}" y="${ly+1}" class="legend-text" font-size="11">→ link label = interface</text>`;
    svg.innerHTML=s;

    // ---- Interactivity: click node -> detail panel (idempotent), hover tooltip ----
    const host=document.createElement('div');
    host.id='map-host';
    host.style.cssText='position:absolute;inset:0;pointer-events:none';
    stage.appendChild(host);
    svg.querySelectorAll('.map-node').forEach(n=>{
      n.style.pointerEvents='all';
      n.addEventListener('click',e=>{e.stopPropagation();showMapDevInfo(+n.getAttribute('data-id'));});
      n.addEventListener('mouseenter',e=>{
        const on=n.getAttribute('data-on')==='1';
        _mapTip(`<strong>${esc(n.getAttribute('data-name'))}</strong><br>${esc(n.getAttribute('data-role'))} · ${esc(n.getAttribute('data-ip'))}<br>${on?'Online':'Offline'}`,e.clientX,e.clientY);
      });
      n.addEventListener('mousemove',e=>_mapTip(`<strong>${esc(n.getAttribute('data-name'))}</strong><br>${esc(n.getAttribute('data-role'))} · ${esc(n.getAttribute('data-ip'))}`,e.clientX,e.clientY));
      n.addEventListener('mouseleave',_hideMapTip);
    });
    // Click empty svg closes panel
    svg.addEventListener('click',()=>{const b=document.getElementById('map-dev-info');if(b)b.remove();});
    // ---- Zoom / pan (preserve original viewBox; center-anchored scaling) ----
    const svgRect=()=>svg.getBoundingClientRect();
    const parseVB=()=>svg.getAttribute('viewBox').split(' ').map(Number);
    const ORIG=parseVB();               // original, never mutated
    let vb=ORIG.slice();
    const setVB=()=>svg.setAttribute('viewBox',vb.join(' '));
    const fit=()=>{vb=ORIG.slice();setVB();};
    const clampMin=w=>Math.max(w,40);   // never let width go pathological
    const zoom=(f,clientX,clientY)=>{
      const rect=svgRect();
      if(!rect.width||!rect.height)return;
      // anchor = screen point (default center)
      const ax=clientX==null?rect.left+rect.width/2:clientX;
      const ay=clientY==null?rect.top+rect.height/2:clientY;
      // anchor in current svg coords
      const px=vb[0]+(ax-rect.left)/rect.width*vb[2];
      const py=vb[1]+(ay-rect.top)/rect.height*vb[3];
      const nwx=clampMin(vb[2]/f), nwy=clampMin(vb[3]/f);
      // keep the anchor point fixed
      const nx=px-(ax-rect.left)/rect.width*nwx;
      const ny=py-(ay-rect.top)/rect.height*nwy;
      vb=[nx,ny,nwx,nwy];setVB();
    };
    const elZin=stage.querySelector('#map-zin'),elZout=stage.querySelector('#map-zout'),elFit=stage.querySelector('#map-fit');
    elZin.onclick=()=>zoom(1.25);
    elZout.onclick=()=>zoom(0.8);
    elFit.onclick=fit;
    // wheel zoom
    svg.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.12:0.89,e.clientX,e.clientY);},{passive:false});
    // drag pan
    let drag=null;
    svg.addEventListener('pointerdown',e=>{if(e.target.closest&&e.target.closest('.map-node'))return;drag={x:e.clientX,y:e.clientY,vb:vb.slice()};if(svg.setPointerCapture)svg.setPointerCapture(e.pointerId);});
    svg.addEventListener('pointermove',e=>{
      if(!drag)return;
      const rect=svgRect();
      const sx=drag.vb[2]/rect.width, sy=drag.vb[3]/rect.height;
      vb=[drag.vb[0]-(e.clientX-drag.x)*sx,drag.vb[1]-(e.clientY-drag.y)*sy,drag.vb[2],drag.vb[3]];setVB();
    });
    const endDrag=()=>{drag=null;};
    svg.addEventListener('pointerup',endDrag);
    svg.addEventListener('pointerleave',endDrag);
    fit();
  }catch(e){
    stage.innerHTML=`<p style="padding:30px;color:var(--bad)">Error: ${esc(String(e))}</p>`;
  }
}

async function fetchTrafficChart(id){
  const canvas=document.getElementById('dev-chart-'+id);
  if(!canvas)return;
  try{
    const r=await api(`/devices/${id}/traffic`);
    drawTrafficChart(canvas,r);
  }catch(e){canvas.style.display='none'}
}
function drawTrafficChart(canvas,data){
  const ctx=canvas.getContext('2d');
  const W=canvas.width,H=canvas.height;
  ctx.clearRect(0,0,W,H);
  if(data.length<2)return;
  // Sort by time
  data.sort((a,b)=>new Date(a.ts)-new Date(b.ts));
  // Find max for scaling
  const max=Math.max(...data.flatMap(d=>[d.rx,d.tx]));
  if(!max)return;
  // Resolve theme tokens to concrete colors (Canvas 2D cannot read var()/hex
  // only; resolving here keeps the chart in light/dark mode).
  const cssv=n=>(getComputedStyle(document.documentElement).getPropertyValue(n)||'').trim()||'#888';
  const colRX=cssv('--acc'),colTX=cssv('--bad'),colMut=cssv('--mut');
  // Draw RX and TX lines
  const drawLine=(key,color)=>{
    ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.beginPath();
    data.forEach((d,i)=>{
      const x=W*i/(data.length-1);
      const y=H-(d[key]/max)*H;
      if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    });
    ctx.stroke();
  };
  drawLine('rx',colRX);
  drawLine('tx',colTX);
  // Labels
  ctx.fillStyle=colMut;ctx.font='9px sans-serif';
  ctx.fillText('RX',4,12);ctx.fillText('TX',20,12);
}

    <div class="row" style="justify-content:flex-end;gap:8px"><button class="act" id="sa-cancel">Cancel</button><button class="act pri" id="sa-ok">OK</button></div></div>`;

async function addFromSweep(host){
  const name=prompt('Name for '+host+':',host);if(!name)return;
  let access;
  await new Promise(r=>selectAccess(v=>{access=v;r()}));
  if(!access)return;
  let d={name,host,role:'router',access};

  else{d.luci_user=prompt('LuCI user:','root');d.luci_pass=prompt('LuCI password:')||'';d.luci_port=null}

function showLogin(msg){
  const gate=document.getElementById('login-gate');
  const main=document.querySelector('main');
  const err=document.getElementById('login-err');
  if(main)main.style.display='none';
  if(gate)gate.hidden=false;
  if(err)err.textContent=msg||'';
  const inp=document.getElementById('login-pass');
  if(inp){inp.value='';setTimeout(()=>inp.focus(),0);}
  stopPolling && stopPolling();
}
function hideLogin(){
  const gate=document.getElementById('login-gate');
  const main=document.querySelector('main');
  if(gate)gate.hidden=true;
  if(main)main.style.display='';
}
async function verifySession(t){
  try{const r=await fetch('/api/network',{headers:{'Authorization':'Bearer '+t}});return r.status===200;}
  catch(e){return false;}
}
async function tryLogin(){
  const u=(document.getElementById('login-user')||{}).value||'';
  const p=(document.getElementById('login-pass')||{}).value||'';
  const err=document.getElementById('login-err');
  if(!u||!p){if(err)err.textContent='Enter your username and password';return;}
  if(err)err.textContent='Checking…';
  try{
    const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    const j=await r.json().catch(()=>({}));
    if(r.ok && j.session){
      TOKEN=j.session;localStorage.setItem('owctl_session',j.session);
      ROLE=(j.role||'').toLowerCase();localStorage.setItem('owctl_role',ROLE);
      hideLogin();render('network');startPolling(60000);showAdminUI();
      return;
    }
    if(err)err.textContent=j.detail||'Sign-in failed';
  }catch(e){if(err)err.textContent='Network error';}
}
function showAdminUI(){document.querySelectorAll('.adm-only').forEach(el=>el.style.display='')}
function bootApp(){
  if(TOKEN){
    verifySession(TOKEN).then(ok=>{
      if(ok){hideLogin();render('network');startPolling(60000);showAdminUI();}
      else{localStorage.removeItem('owctl_session');localStorage.removeItem('owctl_role');ROLE='';showLogin();}
    });
  }else{showLogin();}
}
function toggleTheme(){document.body.classList.toggle('light')}
bootApp();

async function dhpcApply(k, vlan_id, iface){
  const didEl=document.getElementById('dhcp-did');
  const did=didEl?parseInt(didEl.value):null;
  if(!did){toast('No SSH device available',true);return}
  // resolve vlan/iface for the "new" card from its own inputs
  let v=vlan_id, f=iface;
  if(k==='new'){
    v=parseInt(document.getElementById('dhpc-new-vlan').value)||1;
    f=(document.getElementById('dhpc-new-iface').value||'').trim()||('vlan_'+v);
  }
  const g=id=>document.getElementById(id);
  const val=id=>g(id)?g(id).value.trim():'';
  const chk=id=>g(id)?g(id).checked:false;
  const start=val(_dh(k)+'start'), limit=val(_dh(k)+'limit');
  const ipv6={};
  const v6=val(_dh(k)+'v6mode'); if(v6)ipv6.dhcpv6=v6;
  if(chk(_dh(k)+'ra'))ipv6.ra=true;
  const ram=val(_dh(k)+'ram'); if(ram)ipv6.ra_management=ram;
  if(chk(_dh(k)+'ras'))ipv6.ra_service=true;
  const radl=val(_dh(k)+'radl'); if(radl)ipv6.ra_default_lifetime=radl;
  const ral=val(_dh(k)+'ral'); if(ral)ipv6.ra_lifetime=ral;
  const body={
    did, vlan_id:(v||1), interface:f,
    start:start?parseInt(start):100, limit:limit?parseInt(limit):150,
    lease_time:val(_dh(k)+'lease')||'12h',
    dhcpv4:val(_dh(k)+'v4')||'server',
    netmask:val(_dh(k)+'netmask'), broadcast:val(_dh(k)+'bcast'),
    subnet:val(_dh(k)+'subnet'), ifname:val(_dh(k)+'ifname'),
    local:chk(_dh(k)+'local'), no_resolve:chk(_dh(k)+'nore'),
    notransfer:chk(_dh(k)+'notr'), no_default:chk(_dh(k)+'nodef'),
    options:val(_dh(k)+'opts').split('\n').map(s=>s.trim()).filter(Boolean),
    static_leases:dhcpReadLeases(k),
    ipv6:Object.keys(ipv6).length?ipv6:{},
    enabled:chk(_dh(k)+'enabled'),
  };
  const resId=_dh(k)+'result';
  const res=el=>{const e=document.getElementById(resId);if(e)e.innerHTML=el;};
  try{
    toast('Applying DHCP section '+f+'...');
    const r=await api('/dhcp/apply',{method:'POST',body:JSON.stringify(body)});
    res(`<div class="muted" style="margin-top:6px;color:var(--ok)">Applied ${esc(f)} on ${esc(r.device)}</div>`);
    setTimeout(renderDhcp,600);
  }catch(e){
    res(`<div class="muted" style="margin-top:6px;color:var(--bad)">${esc(String(e))}</div>`);
  }
}
async function dhpcDelete(k, vlan_id, iface){
  const didEl=document.getElementById('dhcp-did');
  const did=didEl?parseInt(didEl.value):null;
  if(!did){toast('No SSH device available',true);return}
  if(!confirm('Disable (delete) the DHCP section for '+iface+'?'))return;
  try{
    await api('/dhcp/apply',{method:'POST',body:JSON.stringify({did,vlan_id:(vlan_id||1),interface:iface,enabled:false})});
    toast('DHCP section '+iface+' disabled');
    setTimeout(renderDhcp,400);
  }catch(e){toast(String(e),true);}
}

      }
      html+=`</div>`;
    }
    html+=`</div>`;
    // --- Packages (installed + obsolete) ---
    html+=`<div class="card" style="margin-top:16px">
      <h3>Installed packages</h3>
      <p class="small muted">Live from opkg. Obsolete packages are installed but no longer in any feed — safe to remove.</p>
      ${wifi_devs.map(d=>`<div style="margin:8px 0">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <strong>${esc(d.name)}</strong>
          ${NET_ADVANCED?`<button class="act" onclick="packagesModal(${d.id})">Manage</button>`:''}
        </div>
        <div id="pkg-summary-${d.id}" class="small muted">Loading…</div>
      </div>`).join('')}
    </div>`;
    el.innerHTML=html;

    for(const d of wifi_devs){
      try{
        const pk=await api(`/devices/${d.id}/packages`);
        const el=document.getElementById(`pkg-summary-${d.id}`);
        if(!el)continue;
        if(pk.stale){ el.innerHTML=`<span class="muted">no data yet — run a check</span>`; continue; }
        const obs=pk.obsolete||[];
        const total=(pk.installed||[]).length;
        el.innerHTML=`<span class="small">${total} installed`;
        if(obs.length){
          el.innerHTML+=` · <span style="color:var(--warn)">${obs.length} obsolete</span>`;
          el.innerHTML+=` <button class="act" style="font-size:11px;padding:1px 6px" onclick="packagesModal(${d.id})">review</button>`;
        }
        el.innerHTML+=`</span>`;
      }catch(e){
        const el=document.getElementById(`pkg-summary-${d.id}`);
        if(el)el.innerHTML=`<span class="small bad">error</span>`;
      }
    }
    // --- Mesh (802.11s) ---
    html+=`<div class="card" style="margin-top:16px">
      <h3>Mesh (802.11s / batman-adv) <span class="pill" id="mesh-badge" style="margin-left:8px;font-size:11px">—</span></h3>
      <p class="small muted">Turn the device into a mesh node. Requires the meshd package; owctl installs it when missing.</p>
      ${wifi_devs.map(d=>`<div class="row" style="margin:8px 0;align-items:center;justify-content:space-between">
        <span><strong>${esc(d.name)}</strong> <span class="small muted">${esc(d.host)}</span></span>
        <span id="mesh-status-${d.id}" class="small muted">…</span>
        ${NET_ADVANCED?`<button class="act" onclick="meshModal(${d.id})">Configure mesh</button>`:''}
      </div>`).join('')}
    </div>`;
    el.innerHTML=html;

    let meshOn=0;
    for(const d of wifi_devs){
      try{
        const cfg=await api(`/devices/${d.id}/mesh`);
        const st=document.getElementById(`mesh-status-${d.id}`);
        if(st){
          if(cfg.interfaces&&cfg.interfaces.length){
            const i=cfg.interfaces[0];
            st.innerHTML=`<span style="color:var(--ok)">✓ mesh iface · mode=${esc(i.mode||'?')} · mesh=${esc(i.mesh||'?')}</span>`;
            meshOn++;
          }else{
            st.innerHTML=`<span class="muted">not configured</span>`;
          }
        }
      }catch(e){
        const st=document.getElementById(`mesh-status-${d.id}`);
        if(st)st.innerHTML=`<span class="small bad">error</span>`;
      }
    }
    // Summarize the mesh badge from real data (was dead UI).
    const badge=document.getElementById('mesh-badge');
    if(badge){badge.textContent=meshOn?`${meshOn} node${meshOn>1?'s':''} on`:'off';}


    for(const d of wifi_devs){
      try{
        const cfg=await api(`/devices/${d.id}/wifi-config`);
        const box=document.getElementById(`wifi-config-${d.id}`);
        if(!box)continue;
        const ifaces=cfg.interfaces||[];
        if(!ifaces.length){
          box.innerHTML='<p class="small muted">No SSIDs configured</p>';
          continue;
        }
        let list='<div style="margin:8px 0">';
        for(const i of ifaces){
          const b=i.band?` · ${i.band}`:'';
          const mode=i.mode?` (${i.mode})`:'';
          list+=`<div class="kv">
            <span><strong>${esc(i.ssid||i.name)}</strong>${b}</span>
            <span class="small">${esc(i.encryption||'open')}${mode}</span>
          </div>`;
        }
        list+='</div>';
        box.innerHTML=list;
      }catch(e){
        const box=document.getElementById(`wifi-config-${d.id}`);
        if(box)box.innerHTML=`<p class="small bad">Error: ${esc(e.message||e)}</p>`;
      }
    }
  })();
}

async function cloneWifiModal(srcId){
  const devs=await api('/devices');
  const src=devs.find(d=>d.id===srcId);
  if(!src)return;
  const others=devs.filter(d=>d.id!==srcId && d.access==='ssh');
  if(!others.length){ toast('No other SSH-accessible devices to clone to', true); return; }
  const modal=document.createElement('div');
  modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;display:flex;align-items:center;justify-content:center';
  modal.innerHTML=`<div style="background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;min-width:360px;max-width:480px">
    <h3 style="margin:0 0 8px">Clone WiFi from ${esc(src.name)}</h3>
    <p class="small muted" style="margin:0 0 14px">Copies all SSIDs/keys onto target devices. Maps 2.4GHz → 2.4GHz radio, 5GHz → 5GHz radio automatically.</p>
    <div style="margin-bottom:14px">
      <label>Target devices</label>
      <div style="display:flex;flex-direction:column;gap:6px;margin-top:6px;max-height:180px;overflow:auto">
        ${others.map(d=>`<label style="display:flex;align-items:center;gap:6px"><input type="checkbox" class="clone-tgt-cb" value="${d.id}" checked> ${esc(d.name)} (${esc(d.host)})</label>`).join('')}
      </div>
    </div>
    <div id="clone-results"></div>
    <div class="row" style="justify-content:flex-end;gap:8px;margin-top:14px">
      <button class="act" onclick="this.closest('div[style*=fixed]').remove()">Cancel</button>
      <button class="act pri" id="clone-go">Clone WiFi</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
  modal.querySelector('#clone-go').onclick=async()=>{
    const ids=[...modal.querySelectorAll('.clone-tgt-cb:checked')].map(c=>+c.value);
    if(!ids.length){ toast('Select at least one target device', true); return; }
    const btn=modal.querySelector('#clone-go');
    btn.disabled=true; btn.textContent='Cloning…';
    try{
      const r=await api(`/devices/${srcId}/wifi-clone`,{method:'POST',body:JSON.stringify({target_ids:ids})});
      let resHtml='<div style="margin-top:10px;font-size:12px">';
      for(const res of r.results){
        if(res.ok){
          resHtml+=`<div style="color:var(--ok)">✓ ${esc(res.name)}: ${esc((res.applied||[]).join(', ')||'applied')}</div>`;
          if(res.skipped&&res.skipped.length) resHtml+=`<div style="color:var(--warn)">  skipped: ${esc(res.skipped.join(', '))}</div>`;
        } else {
          resHtml+=`<div style="color:var(--bad)">✗ ${esc(res.name||res.target_id)}: ${esc(res.detail)}</div>`;
        }
      }
      resHtml+='</div>';
      modal.querySelector('#clone-results').innerHTML=resHtml;
      toast('WiFi clone complete');
      renderWifi();
    }catch(e){
      toast(String(e), true);
    }
    btn.disabled=false; btn.textContent='Clone WiFi';
  };
  modal.onclick=e=>{if(e.target===modal)modal.remove()};
}
async function meshModal(did){
  const devs=await api('/devices');
  const d=devs.find(x=>x.id===did);
  if(!d)return;
  let cfg=null;
  try{ cfg=await api(`/devices/${did}/mesh`); }catch(e){}
  const modal=document.createElement('div');
  modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;display:flex;align-items:center;justify-content:center';
  modal.innerHTML=`<div style="background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;min-width:420px;max-width:560px">
    <h3 style="margin:0 0 4px">Mesh configuration · ${esc(d.name)}</h3>
    <p class="small muted" style="margin:0 0 14px">${esc(d.host)} — 802.11s mesh (meshd)</p>
    <div class="row" style="margin-bottom:10px">
      <div style="flex:1"><label>Mesh ID</label><input id="mesh-id" value="mesh" style="width:100%"></div>
      <div style="flex:1"><label>Radio (VAP)</label><select id="mesh-vap" style="width:100%"></select></div>
    </div>
    <div class="row" style="margin-bottom:10px">
      <div style="flex:1"><label>Network</label><input id="mesh-net" value="lan" style="width:100%"></div>
      <div style="flex:1"><label>HT mode</label><select id="mesh-ht" style="width:100%"><option value="">— inherit —</option><option value="HT20">HT20</option><option value="HT40">HT40</option></select></div>
    </div>
    <div class="row" style="margin-bottom:10px">
      <div style="flex:1"><label>Channel</label><input id="mesh-chan" type="number" min="0" max="196" value="" style="width:100%"></div>
      <div style="flex:1"><label>Encryption</label><select id="mesh-enc" style="width:100%"><option value="none">none</option><option value="psk2">psk2</option><option value="sae">sae</option></select></div>
    </div>
    <div id="mesh-key-row" style="margin-bottom:10px"><label>Mesh key (passphrase)</label><input id="mesh-key" type="password" value="" style="width:100%"></div>
    <label style="display:flex;align-items:center;gap:6px;margin-bottom:14px"><input type="checkbox" id="mesh-gw" checked> Act as mesh gateway</label>
    <div id="mesh-results"></div>
    <div class="row" style="justify-content:flex-end;gap:8px;margin-top:14px">
      <button class="act" onclick="this.closest('div[style*=fixed]').remove()">Cancel</button>
      <button class="act pri" id="mesh-save">Apply mesh</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
  // populate radios
  try{
    const wcfg=await api(`/devices/${did}/wifi-config`);
    const radios=[...new Set((wcfg.interfaces||[]).map(i=>i.device).filter(Boolean))];
    const sel=modal.querySelector('#mesh-vap');
    if(radios.length){ radios.forEach(r=>sel.add(new Option(r,r))); } else { sel.add(new Option('radio0','radio0')); }
  }catch(e){}
  modal.querySelector('#mesh-enc').onchange=()=>{
    modal.querySelector('#mesh-key-row').style.display = modal.querySelector('#mesh-enc').value==='none' ? 'none' : '';
  };
  modal.querySelector('#mesh-save').onclick=async()=>{
    const enc=modal.querySelector('#mesh-enc').value;
    const body={
      enabled:true,
      mesh_vap:modal.querySelector('#mesh-vap').value,
      mesh_id:modal.querySelector('#mesh-id').value,
      mesh_network:modal.querySelector('#mesh-net').value,
      mesh_htmode:modal.querySelector('#mesh-ht').value,
      mesh_channel:modal.querySelector('#mesh-chan').value,
      mesh_encryption:enc,
      mesh_key:enc==='none'?'':modal.querySelector('#mesh-key').value,
      mesh_gw_mode:modal.querySelector('#mesh-gw').checked?'gwb':'no',
      install_if_missing:true,
    };
    const btn=modal.querySelector('#mesh-save');
    btn.disabled=true; btn.textContent='Applying…';
    try{
      await api(`/devices/${did}/mesh`,{method:'POST',body:JSON.stringify(body)});
      modal.querySelector('#mesh-results').innerHTML='<div style="color:var(--ok);margin-top:10px">Mesh applied · wifi reload issued</div>';
      toast('Mesh configured on '+d.name);
      renderWifi();
      setTimeout(()=>modal.remove(),1200);
    }catch(e){
      modal.querySelector('#mesh-results').innerHTML='<div style="color:var(--bad);margin-top:10px">'+esc(String(e))+'</div>';
      toast(String(e),true);
    }
    btn.disabled=false; btn.textContent='Apply mesh';
  };
  modal.onclick=e=>{if(e.target===modal)modal.remove()};
}
async function packagesModal(did){
  const devs=await api('/devices');
  const d=devs.find(x=>x.id===did);
  if(!d)return;
  let pk=null;
  try{ pk=await api(`/devices/${did}/packages`); }catch(e){}
  const modal=document.createElement('div');
  modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;display:flex;align-items:center;justify-content:center';
  const installed=(pk&&pk.installed)||[];
  const obsolete=(pk&&pk.obsolete)||[];
  const stale=pk&&pk.stale;
  modal.innerHTML=`<div style="background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;min-width:460px;max-width:620px;max-height:80vh;overflow:auto">
    <h3 style="margin:0 0 4px">Installed packages · ${esc(d.name)}</h3>
    <p class="small muted" style="margin:0 0 14px">${installed.length} installed · ${obsolete.length} obsolete</p>
    ${stale?`<p class="small muted">No data yet — run a device check first.</p>`:''}
    ${obsolete.length?`<div style="margin-bottom:14px">
      <h4 style="margin:0 0 6px;color:var(--warn)">Obsolete (no longer in any feed)</h4>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        ${obsolete.map(p=>`<span style="background:rgba(245,181,68,.12);border:1px solid var(--warn);border-radius:999px;padding:2px 10px;font-size:12px;display:flex;align-items:center;gap:6px">${esc(p)} <button class="act" style="font-size:11px;padding:0 5px" onclick="removePkg(${did},'${esc(p)}')">×</button></span>`).join('')}
      </div>
    </div>`:''}
    <div style="margin-bottom:14px">
      <h4 style="margin:0 0 6px">Installed (${installed.length})</h4>
      <div style="display:flex;flex-wrap:wrap;gap:6px;max-height:240px;overflow:auto">
        ${installed.map(p=>`<span style="background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px">${esc(p)}</span>`).join('')}
      </div>
    </div>
    <div class="row" style="justify-content:flex-end;gap:8px">
      <button class="act" onclick="this.closest('div[style*=fixed]').remove()">Close</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
  modal.onclick=e=>{if(e.target===modal)modal.remove()};
}

async function removePkg(did, pkg){
  if(!confirm(`Remove ${pkg} from device ${did}?`))return;
  try{
    await api(`/devices/${did}/packages/remove`,{method:'POST',body:JSON.stringify({pkg})});
    toast(pkg+' removed');
    renderWifi();
  }catch(e){ toast(String(e),true); }
}




function vlanOpt(v){
  const label='VLAN '+v.id+(v.subnet?` (${v.subnet})`:'');
  return `<option value="${v.id}">${esc(label)}</option>`;
}
async function editWifi(did){
  const devs=await api('/devices');
  const d=devs.find(x=>x.id===did);
  if(!d)return;
  const vlans=await api('/vlans').catch(()=>[]);
  const modal=document.createElement('div');
  modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;display:flex;align-items:center;justify-content:center';
  modal.innerHTML=`<div style="background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;min-width:350px;max-width:450px">
    <h3 style="margin:0 0 16px">Configure WiFi: ${esc(d.name)}</h3>
    <div style="margin-bottom:12px"><label>SSID (network name)</label><input id="wifi-ssid" placeholder="e.g. Guest-Network" style="width:100%"></div>
    <div style="margin-bottom:12px"><label>Password (WPA2)</label><input id="wifi-pwd" type="password" placeholder="Minimum 8 characters" style="width:100%"></div>
    <div style="margin-bottom:12px"><label style="display:flex;justify-content:space-between;align-items:center">VLAN (optional)
      <button class="act" id="wifi-vlan-disc" title="Scan all devices for configured VLANs" style="margin-left:8px">⟳ discover</button></label>
      <select id="wifi-vlan" style="width:100%"><option value="">— no VLAN (LAN) —</option>${vlans.map(vlanOpt).join('')}</select></div>
    <div class="row" style="justify-content:flex-end;gap:8px">
      <button class="act" onclick="this.closest('div[style*=fixed]').remove()">Cancel</button>
      <button class="act pri" id="wifi-save">Save</button>
      <button class="act" id="wifi-delete" style="color:var(--bad)">Delete</button>
    </div></div>`;
  document.body.appendChild(modal);
  modal.querySelector('#wifi-save').onclick=async()=>{
    const ssid=modal.querySelector('#wifi-ssid').value.trim();
    const pwd=modal.querySelector('#wifi-pwd').value.trim();
    const vlan_id=modal.querySelector('#wifi-vlan').value||null;
    if(!ssid||!pwd){toast('SSID and password required',true);return}
    try{
      toast('Applying WiFi config…');
      const r=await api(`/devices/${did}/guest-wifi`,{method:'POST',body:JSON.stringify({ssid,password:pwd,vlan_id})});
      toast('WiFi config saved');
      modal.remove();
      renderWifi();
    }catch(e){toast(String(e),true)}
  };
  modal.querySelector('#wifi-delete').onclick=async()=>{
    if(!confirm(`Delete guest WiFi on ${d.name}?`))return;
    try{
      await api(`/devices/${did}/guest-wifi`,{method:'POST',body:JSON.stringify({method:'delete'})});
      toast('Guest WiFi deleted');
      modal.remove();
      renderWifi();
    }catch(e){toast(String(e),true)}
  };
  const disc=modal.querySelector('#wifi-vlan-disc');
  if(disc)disc.onclick=async()=>{
    disc.disabled=true;disc.textContent='Scanning…';
    try{
      const r=await api('/vlans/discover',{method:'POST',body:'{}'});
      const sel=modal.querySelector('#wifi-vlan');
      const keep=sel.value;
      sel.innerHTML='<option value="">— no VLAN (LAN) —</option>'+((r.vlans||[]).map(vlanOpt).join(''));
      if((r.vlans||[]).some(v=>String(v.id)===keep))sel.value=keep;
      toast(`Discovered ${r.vlans_found.length} VLAN(s) across ${r.devices_scanned} device(s)`);
    }catch(e){toast(String(e),true)}
    disc.disabled=false;disc.textContent='⟳ discover';
  };
  modal.onclick=e=>{if(e.target===modal)modal.remove()};
}
function renderUsers(){
  const el=document.getElementById('tab-users');if(!el)return;
  el.innerHTML='<div class="panel"><h2>User management</h2><div id="user-list"></div><h3>Add user</h3><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'+
    '<input id="u-new-name" placeholder="Username" style="padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--tx)">'+
    '<input id="u-new-pass" type="password" placeholder="Password" style="padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--tx)">'+
    '<select id="u-new-role" style="padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--tx)">'+
    '<option value="observer">Observer</option><option value="admin">Admin</option></select>'+
    '<button onclick="addUser()" style="padding:6px 14px;border-radius:6px;border:none;background:var(--acc);color:#08101e;cursor:pointer">Add</button>'+
    '</div></div>';
  loadUsers();
}
async function loadUsers(){
  const el=document.getElementById('user-list');if(!el)return;
  try{
    const users=await api('/users');
    el.innerHTML=users.length?'<table class="ut">'+users.map(u=>`<tr><td>${esc(u.username)}</td><td><span class="pill" style="font-size:11px">${esc(u.role)}</span></td><td>${u.enabled?'<span style="color:var(--ok)">active</span>':'<span style="color:var(--bad)">disabled</span>'}</td><td>${u.last_login||''}</td><td>${u.id!==1?`<button onclick="toggleUser(${u.id},${u.enabled?0:1})" style="padding:3px 8px;border-radius:5px;border:1px solid var(--line);background:transparent;color:var(--tx);cursor:pointer">${u.enabled?'Disable':'Enable'}</button><button onclick="deleteUser(${u.id})" style="padding:3px 8px;border-radius:5px;border:1px solid var(--bad);background:transparent;color:var(--bad);cursor:pointer;margin-left:4px">Delete</button>`:''}</td></tr>`).join(''):'<p>No users.</p>';
  }catch(e){el.textContent='Error loading users: '+e.message;}
}
async function addUser(){
  const name=(document.getElementById('u-new-name')||{}).value||'';
  const pass=(document.getElementById('u-new-pass')||{}).value||'';
  const role=(document.getElementById('u-new-role')||{}).value||'observer';
  if(!name||!pass){toast('Name and password required',true);return;}
  try{await api('/users',{method:'POST',body:JSON.stringify({username:name,password:pass,role})});toast('User created');loadUsers();}
  catch(e){toast(e.message,true);}
}
async function toggleUser(uid,on){
  try{await api('/users/'+uid,{method:'PUT',body:JSON.stringify({enabled:on})});loadUsers();}
  catch(e){toast(e.message,true);}
}
async function deleteUser(uid){
  if(!confirm('Delete this user?'))return;
  try{await api('/users/'+uid,{method:'DELETE'});toast('Deleted');loadUsers();}
  catch(e){toast(e.message,true);}
}
</script>
